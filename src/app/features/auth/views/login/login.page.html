<main class="login-screen">
  <section class="login-content" aria-labelledby="loginTitle">
    <h1 class="login-brand" id="loginTitle">AnDrive</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="login-field">
        <label class="visually-hidden" for="email">Adresse e-mail</label>
        <div class="login-input">
          <i class="bi bi-envelope" aria-hidden="true"></i>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="Email (ex: jean@aninf.ga)"
          />
        </div>
        <div
          class="login-error"
          *ngIf="form.controls.email.touched && form.controls.email.invalid"
        >
          Adresse e-mail invalide.
        </div>
      </div>

      <div class="login-field">
        <label class="visually-hidden" for="password">Mot de passe</label>
        <div class="login-input">
          <i class="bi bi-lock" aria-hidden="true"></i>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Mot de passe"
          />
          <button
            class="password-toggle"
            type="button"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Cacher le mot de passe' : 'Afficher le mot de passe'"
          >
            <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <div
          class="login-error"
          *ngIf="form.controls.password.touched && form.controls.password.invalid"
        >
          Mot de passe requis.
        </div>
      </div>

      <div class="login-error login-error--server" *ngIf="errorMessage()" role="alert">
        {{ errorMessage() }}
      </div>

      <button
        class="login-submit"
        type="submit"
        [disabled]="form.invalid || isLoading()"
      >
        <span class="login-submit__title">
          {{ isLoading() ? 'Connexion en cours…' : 'Se connecter' }}
        </span>
        <span class="login-submit__subtitle">Valider vos identifiants pour démarrer</span>
      </button>
    </form>
  </section>
</main>
