<main class="container py-5" style="max-width: 460px">
  <section class="card shadow-sm border-0">
    <div class="card-body p-4">
      <h1 class="h3 mb-2">Première connexion</h1>
      <p class="text-secondary">
        Pour des raisons de sécurité, veuillez définir un nouveau mot de
        passe avant de continuer.
      </p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label" for="nouveauMotDePasse">
            Nouveau mot de passe
          </label>
          <div class="input-group">
            <input
              class="form-control"
              id="nouveauMotDePasse"
              [type]="showNewPassword() ? 'text' : 'password'"
              formControlName="nouveauMotDePasse"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="toggleNewPasswordVisibility()"
              [attr.aria-label]="showNewPassword() ? 'Cacher le mot de passe' : 'Afficher le mot de passe'"
            >
              <svg *ngIf="!showNewPassword()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showNewPassword()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div
            class="text-danger small mt-1"
            *ngIf="form.controls.nouveauMotDePasse.touched && form.controls.nouveauMotDePasse.errors?.['required']"
          >
            Le nouveau mot de passe est requis.
          </div>
          <div
            class="text-danger small mt-1"
            *ngIf="form.controls.nouveauMotDePasse.touched && form.controls.nouveauMotDePasse.errors?.['minlength']"
          >
            Le mot de passe doit contenir au moins 8 caractères.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="confirmationMotDePasse">
            Confirmation de mot de passe
          </label>
          <div class="input-group">
            <input
              class="form-control"
              id="confirmationMotDePasse"
              [type]="showConfirmPassword() ? 'text' : 'password'"
              formControlName="confirmationMotDePasse"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="btn btn-outline-secondary"
              (click)="toggleConfirmPasswordVisibility()"
              [attr.aria-label]="showConfirmPassword() ? 'Cacher le mot de passe' : 'Afficher le mot de passe'"
            >
              <svg *ngIf="!showConfirmPassword()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showConfirmPassword()" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <div
            class="text-danger small mt-1"
            *ngIf="form.controls.confirmationMotDePasse.touched && form.errors?.['passwordsMismatch']"
          >
            Les mots de passe ne correspondent pas.
          </div>
        </div>

        <div class="text-danger small mb-3" *ngIf="errorMessage()">
          {{ errorMessage() }}
        </div>

        <button
          class="btn btn-primary w-100"
          type="submit"
          [disabled]="form.invalid || isLoading()"
        >
          {{ isLoading() ? 'Validation en cours…' : 'Valider' }}
        </button>
      </form>
    </div>
  </section>
</main>
